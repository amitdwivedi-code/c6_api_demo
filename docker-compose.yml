services:
  kpcl-c6-api:
    image: ghcr.io/indi4/c6_api:latest
    container_name: kpcl-c6-ap
    depends_on:
      - mongodb
    env_file:
      - .env
    restart: always
  
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db 

  kpcl-c6-ui:
    image: ghcr.io/indi4/sustainability_ui:latest
    container_name: kpcl-c6-ui
    # ports:
    #   - 8082:80
    env_file:
      - .env
    depends_on:
      - kpcl-c6-api
    restart: always

networks:
  default:
    external: true
    name: npm_default

volumes:
  mongo-data:
    driver: local