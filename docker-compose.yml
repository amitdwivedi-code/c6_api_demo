services:
  kpcl-c6-api:
    image: ghcr.io/indi4/c6_api:latest
    container_name: kpcl-c6-ap
    depends_on:
      - mongodb
    env_file:
      - .env
    restart: always
  
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db 
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    env_file:
      - .env
    depends_on:
      - kpcl-c6-api
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  kpcl-c6-ui:
    image: ghcr.io/indi4/sustainability_ui:latest
    container_name: kpcl-c6-ui
    # ports:
    #   - 8082:80
    env_file:
      - .env
    depends_on:
      - kpcl-c6-api
    restart: always

networks:
  default:
    external: true
    name: npm_default

volumes:
  mongo-data:
    driver: local